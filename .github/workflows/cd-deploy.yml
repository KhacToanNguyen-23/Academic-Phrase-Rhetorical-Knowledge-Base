name: CD Deploy

# Manual promotion only (ADR-0010/Phase 05): a human picks the exact published
# digest/tag and the "production" GitHub Environment gates it behind a required
# reviewer. Runs on a self-hosted runner installed on the homeserver itself, so no
# SSH key or inbound port is needed to reach it.
#
# One-time setup still required on GitHub (cannot be done from this workflow file):
#   1. Install a self-hosted runner on the homeserver, labeled "homeserver".
#   2. Settings -> Environments -> "production" -> add required reviewers.
#   3. Add homeserver secrets (POSTGRES_PASSWORD, APP_SECRET_KEY, DATABASE_URL) to
#      the "production" environment, never to the repository/organization scope.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag published by CI, e.g. sha-<commit> (see GHCR packages)"
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  # Queue, never cancel: an active production release must run to completion.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 30
    environment: production
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/aprkb-backend:${IMAGE_TAG}" >> "$GITHUB_ENV"
          export BACKEND_IMAGE="ghcr.io/${owner}/aprkb-backend:${IMAGE_TAG}"
          bash scripts/cd/deploy.sh
      - name: Record release evidence
        if: always()
        run: |
          {
            echo "## Release"
            echo "- commit: ${{ github.sha }}"
            echo "- image: ${BACKEND_IMAGE}"
            echo "- actor: ${{ github.actor }}"
            echo "- timestamp: $(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"
