name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run python -m aprkb.cli export-openapi --check
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
        env:
          OPENALEX_ENABLED: "false"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm gen:api
      - run: git diff --exit-code -- src/shared/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm build
