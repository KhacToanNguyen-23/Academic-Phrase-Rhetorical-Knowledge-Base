name: CI

on:
  push:
  pull_request:

# Required check names (document verbatim before ruleset activation; see
# doc/runbooks/ci.md and plans/ci-cd-team-standard/phase-02-enforced-ci.md):
#   CI / backend-quality-and-tests
#   CI / frontend-quality-and-build
# Not yet required (exist, but gated by stability evidence before promotion):
#   CI / backend-image-contract   (Phase 03; requires default-branch green runs first)
#   CI / frontend-e2e-smoke       (Stage A observability only; continue-on-error)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  backend-quality-and-tests:
    name: backend-quality-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aprkb
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aprkb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aprkb -d aprkb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aprkb:postgres@localhost:5432/aprkb_test
      TEST_DATABASE_URL: postgresql+asyncpg://aprkb:postgres@localhost:5432/aprkb_test
      ARTICLE_SOURCE: "null"
      OPENALEX_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --directory apps/backend --locked
      - name: Check generated OpenAPI contract
        run: uv run --directory apps/backend python -m aprkb.cli export-openapi --check
      - name: Lint and type-check backend
        run: make lint
      - name: Migrate disposable CI database
        run: uv run --directory apps/backend alembic -c alembic.ini upgrade head
      - name: PostgreSQL-backed integration tests must not skip
        run: bash scripts/ci/require-db-tests.sh
      - name: Run full backend test suite
        run: make test

  frontend-quality-and-build:
    name: frontend-quality-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend (zero warnings)
        run: pnpm lint
      - name: Check generated API types
        run: pnpm gen:api
      - name: Ensure generated API types are current
        run: git diff --exit-code -- src/shared/api/schema.d.ts
      - name: Type-check frontend
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm build

  backend-image-contract:
    name: backend-image-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-quality-and-tests]
    permissions:
      contents: read
    env:
      BACKEND_IMAGE: aprkb-backend:ci
      CONTAINER_SMOKE_NETWORK: aprkb-ci-net
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the one image API and worker both run from
        run: |
          docker build -f apps/backend/Dockerfile \
            --build-arg GIT_COMMIT_SHA="${{ github.sha }}" \
            -t "$BACKEND_IMAGE" apps/backend
          echo "Built digest: $(docker image inspect --format '{{.Id}}' "$BACKEND_IMAGE")"
      - name: Build-context canary (secrets/caches/blobs/test output must not leak in)
        run: bash scripts/ci/container-canary.sh
      - name: Start disposable PostgreSQL for container smokes
        run: |
          docker network create "$CONTAINER_SMOKE_NETWORK"
          docker run -d --name pg --network "$CONTAINER_SMOKE_NETWORK" \
            -e POSTGRES_USER=aprkb -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=aprkb_ci \
            pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U aprkb -d aprkb_ci && break
            sleep 1
          done
      - name: API container smoke (same digest as worker smoke below)
        run: |
          echo "Smoking digest: $(docker image inspect --format '{{.Id}}' "$BACKEND_IMAGE")"
          bash scripts/ci/container-smoke-api.sh "$BACKEND_IMAGE"
      - name: Worker container smoke (same digest as API smoke above)
        run: |
          echo "Smoking digest: $(docker image inspect --format '{{.Id}}' "$BACKEND_IMAGE")"
          bash scripts/ci/container-smoke-worker.sh "$BACKEND_IMAGE"
      - name: Tear down disposable PostgreSQL
        if: always()
        run: |
          docker rm -f pg || true
          docker network rm "$CONTAINER_SMOKE_NETWORK" || true

  # Stage A (observability only, per plans/ci-cd-team-standard/phase-02-enforced-ci.md):
  # collects trace/screenshot evidence and measures flakiness. It is intentionally not
  # required and must not block merges until a stability window justifies promotion.
  frontend-e2e-smoke:
    name: frontend-e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs: [backend-quality-and-tests, frontend-quality-and-build]
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aprkb
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aprkb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aprkb -d aprkb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://aprkb:postgres@localhost:5432/aprkb_test
      ARTICLE_SOURCE: "null"
      WRITER_E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          # Cache disabled here only: this job's bottleneck is the Playwright
          # browser install, not uv dependency resolution, and the post-job
          # cache-prune step was observed hanging ~5 minutes before failing
          # (uv exit code 2) when the GitHub Actions cache backend degrades.
          enable-cache: false
      - name: Install backend dependencies
        run: uv sync --directory apps/backend --locked
      - name: Migrate and seed the disposable database
        run: |
          uv run --directory apps/backend alembic -c alembic.ini upgrade head
          uv run --directory apps/backend python -m aprkb.seeds.load
      - name: Start backend API in the background
        run: |
          uv run --directory apps/backend uvicorn aprkb.api.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/v1/health && break; sleep 1; done
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start frontend dev server in the background
        working-directory: apps/web
        run: |
          # Force IPv4 loopback explicitly: Vite's default `host: localhost` can
          # resolve to IPv6-only on some CI runners, which the IPv4 health check
          # and WRITER_E2E_BASE_URL below would never be able to reach.
          pnpm exec vite --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173 && break; sleep 1; done
      - name: Run Playwright e2e specs
        working-directory: apps/web
        run: pnpm test:e2e
      - name: Upload traces/screenshots on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-smoke
          path: |
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Backend/frontend logs on failure
        if: ${{ !cancelled() }}
        run: |
          echo "---- backend log ----"; cat /tmp/api.log || true
          echo "---- frontend log ----"; cat /tmp/web.log || true
