name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aprkb
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aprkb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aprkb -d aprkb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aprkb:postgres@localhost:5432/aprkb_test
      TEST_DATABASE_URL: postgresql+asyncpg://aprkb:postgres@localhost:5432/aprkb_test
      OPENALEX_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --directory apps/backend --locked
      - name: Check generated OpenAPI contract
        run: uv run --directory apps/backend python -m aprkb.cli export-openapi --check
      - name: Lint and type-check backend
        run: make lint
      - name: Migrate disposable CI database
        run: uv run --directory apps/backend alembic -c alembic.ini upgrade head
      - name: Run backend tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated API types
        run: pnpm gen:api
      - name: Ensure generated API types are current
        run: git diff --exit-code -- src/shared/api/schema.d.ts
      - name: Type-check frontend
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm build
