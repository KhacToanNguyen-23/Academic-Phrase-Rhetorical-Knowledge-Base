[project]
name = "aprkb"
version = "0.1.0"
description = "AP-RKB backend: API + worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "httpx>=0.28",
  "tenacity>=9.0",
  "structlog>=24.4",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# M2 — Corpus Intelligence
nlp = [
  "spacy>=3.8",
  "sentence-transformers>=3.3",
  "lxml>=5.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aprkb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
