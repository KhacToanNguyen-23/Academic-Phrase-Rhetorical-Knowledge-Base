# DRAFT lexicon; TODO(owner, FR-06.2): approve markers before production use.
version: 0.4.0
# Shared by mining and V02. Changing this block changes both consumers; use the two
# *_only blocks below for a change that must stay on one side.
markers:
  low: [may, might, could, possibly, appears to]
  moderate: [suggest, suggests, suggested, indicate, indicates, indicated, is likely]
  high: [demonstrate, demonstrates, demonstrated, confirm, confirms, confirmed]
  absolute: [prove, proves, proved, proven, establish beyond doubt, always]

# V02 only: writer-claim evidence policy.
validator_only_markers:
  high: [show, shows, showed]

# Mining only: EpistemicTagger strength. TODO(owner, FR-08.1): decide whether V02 adopts
# `establish` as well; it does not today.
mining_only_markers:
  high: [establish, establishes, established]

# V02 derives regular inflections (-s/-es, -ed/-d, -ing) from each verb marker.
# Irregular forms that rules cannot derive are listed here, keyed by the base verb.
irregular_forms:
  prove: [proven]
  show: [shown]

# Mining only: syntax-valid OOV matches in this set are held from automatic AI activation.
# The set remains subject to the owner review noted in the file header.
neutral_verbs:
  [observe, observes, observed, note, notes, noted, assume, assumes, assumed, select, selects, selected, evaluate,
   evaluates, evaluated, send, sends, sent, use, uses, used, provide, provides, provided,
   illustrate, illustrates, illustrated, design, designs, designed, base, bases, based,
   compose, composes, composed, discuss, discusses, discussed, give, gives, gave, given,
   present, presents, presented, introduce, introduces, introduced, defer, defers, deferred,
   summarize, summarizes, summarized, implement, implements, implemented, set, sets, reflect,
   reflects, reflected]

# Markers that are not verbs keep exact matching and are never inflected.
non_inflecting: [always, could, is likely, may, might, possibly]
