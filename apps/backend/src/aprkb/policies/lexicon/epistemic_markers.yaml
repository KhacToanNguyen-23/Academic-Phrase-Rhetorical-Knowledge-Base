# DRAFT lexicon; TODO(owner, FR-06.2): approve markers before production use.
version: 0.1.0
markers:
  low: [may, might, could, possibly, appears to]
  moderate: [suggest, suggests, suggested, indicate, indicates, indicated, is likely]
  high: [show, shows, showed, demonstrate, demonstrates, demonstrated, confirm, confirms, confirmed]
  absolute: [prove, proves, proved, proven, establish beyond doubt, always]

# V02 derives regular inflections (-s/-es, -ed/-d, -ing) from each verb marker.
# Irregular forms that rules cannot derive are listed here, keyed by the base verb.
irregular_forms:
  prove: [proven]
  show: [shown]

# Markers that are not verbs keep exact matching and are never inflected.
non_inflecting: [always, could, is likely, may, might, possibly]
