version: 0.2.0
licenses:
  - {code: CC0, name: Creative Commons Zero, allows_mining: true, allows_display: true, allows_external_processing: false}
  - {code: CC-BY, name: Creative Commons Attribution, allows_mining: true, allows_display: true, allows_external_processing: false}
  - {code: CC-BY-SA, name: Creative Commons Attribution ShareAlike, allows_mining: true, allows_display: true, allows_external_processing: false}
  - {code: CC-BY-NC, name: Creative Commons Attribution NonCommercial, allows_mining: false, allows_display: false, allows_external_processing: false} # TODO(owner, BR-10): chủ dự án quyết định
  - {code: CC-BY-NC-SA, name: Creative Commons Attribution NonCommercial ShareAlike, allows_mining: false, allows_display: false, allows_external_processing: false} # TODO(owner, BR-10): chủ dự án quyết định
  - {code: CC-BY-ND, name: Creative Commons Attribution NoDerivatives, allows_mining: false, allows_display: false, allows_external_processing: false} # TODO(owner, BR-10): chủ dự án quyết định
  - {code: CC-BY-NC-ND, name: Creative Commons Attribution NonCommercial NoDerivatives, allows_mining: false, allows_display: false, allows_external_processing: false} # TODO(owner, BR-10): chủ dự án quyết định
  - {code: PROPRIETARY, name: Proprietary, allows_mining: false, allows_display: false, allows_external_processing: false}
  # Development only. Assigned to SLR works with no license when SLR_DEV_FALLBACK_LICENSE is set;
  # the app refuses to start with that setting outside APP_ENV=local/test.
  # TODO(owner, BR-10): delete articles under this code and the code itself before production.
  - {code: DEV-UNVERIFIED, name: Development only - rights not verified, allows_mining: true, allows_display: true, allows_external_processing: false}
source_aliases:
