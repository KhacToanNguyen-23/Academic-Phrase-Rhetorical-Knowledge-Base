# Provisional values; TODO(owner, PRD-6.3): approve sentence length bounds for production.
version: 0.6.0
# TODO(owner): review filter behavior against adjudicated frame-section labels.
unknown_single_paper_filter: true
# TODO(owner, FR-07): tune on reviewed frame-section distributions.
frame_section_dominant_share_threshold: 0.6
sentence_filter:
  min_words: 5
  max_words: 60
syntax_filter:
  # Provisional phase-3 gate; TODO(owner, FR-07): calibrate on reviewed gold data.
  require_finite_verb: true
  # TODO(owner, FR-07): estimate false positives on a reviewed real-article sample.
  allow_imperatives: true
# Noise filter (spec 3.1b). Provisional thresholds; TODO(owner, PRD-6.3): calibrate on dev gold.
noise_filter:
  # Sentences in these section codes are never mined.
  excluded_sections: [REFERENCES, BACK_MATTER, FIGURES_TABLES, APPENDIX]
  # A sentence with at least this many "|" characters is treated as a table row.
  min_table_pipes: 2
  # Share of non-space characters that are math symbols, Greek letters, or brackets.
  max_math_symbol_ratio: 0.12
  # Share of whitespace tokens that contain a digit.
  max_numeric_token_ratio: 0.4
