# Provisional ownership tiers; TODO(owner, FR-06.2): approve.
version: 0.4.0
max_subject_words: 8
min_clause_words: 2
own_determiners: [our, "the present", "the current"]
own_head_nouns: [paper, study, article]
contextual_own_pairs:
  ["these results", "these findings", "this result", "this finding", "this method", "this approach", "this model", "this work"]
prior_determiners: [their, prior, previous, earlier]
prior_head_pairs: ["these studies", "these authors"]
# Words right before the reporting verb that change meaning (negation, modality, emphasis).
# They are peeled off the subject and kept literal, so "do not suggest" is never masked.
# TODO(owner, FR-06.2): approve the list.
verb_modifiers:
  [do, does, did, not, never, may, might, could, can, should, would, must,
   also, further, thus, therefore, clearly, strongly, consistently, generally, often]
