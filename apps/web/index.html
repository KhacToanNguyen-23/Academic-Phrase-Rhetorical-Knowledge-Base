<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Wordbank</title>
    <script>
      // Áp theme trước khi render để không nháy màu; mặc định light (xem src/shared/lib/theme.ts).
      try {
        if (sessionStorage.getItem("aw-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/switzer/switzer-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
